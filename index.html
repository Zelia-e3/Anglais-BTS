<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>English Boost BTS</title><style>body{font-family:system-ui;background:#f5f7fb;color:#17233c;margin:0}.wrap{max-width:850px;margin:auto;padding:20px}.hero{background:#183b66;color:white;padding:24px;border-radius:20px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:#dce7f5}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0001}.choice{display:block;width:100%;margin:8px 0;background:#eef3fa;text-align:left}.good{background:#dff6e7!important}.bad{background:#ffe0e0!important}input{width:100%;box-sizing:border-box;padding:13px;border:2px solid #d7dfeb;border-radius:12px;font-size:16px}.small{color:#667085}.score{font-size:18px;font-weight:800}.hidden{display:none}.word{font-size:30px;font-weight:900}.primary{background:#ffcc4d}.next{background:#183b66;color:#fff;margin-top:10px}</style></head><body><div class='wrap'><div class='hero'><h1>🇬🇧 English Boost — BTS</h1><p>Des exercices variés pour apprendre du vocabulaire sans refaire toujours la même chose.</p><div class='score'>⭐ Score : <span id='score'>0</span> • Série : <span id='streak'>0</span></div></div><div class='tabs'><button onclick="start('mix')">🎲 Mix</button><button onclick="start('verbs')">🏃 Verbes</button><button onclick="start('daily')">🏠 Quotidien</button><button onclick="start('work')">💼 BTS / Travail</button><button onclick="start('adjectives')">✨ Adjectifs</button></div><div id='game' class='card'></div><div class='card'><b>🧠 Progression</b><p class='small'>Les questions changent de forme : traduction, QCM, phrase à trous, vrai/faux, association et production.</p><p>À revoir : <span id='review'>0</span> • Acquis : <span id='mastered'>0</span></p></div></div><script>
const W=[
['do','faire','verbs','I ___ my homework every evening.'],['make','fabriquer / faire','verbs','She ___ a cake for her friend.'],['go','aller','verbs','We ___ to school by bus.'],['come','venir','verbs','Can you ___ here?'],['take','prendre','verbs','I ___ the train at 8.'],['get','obtenir / recevoir','verbs','I ___ an email every morning.'],['buy','acheter','verbs','They ___ food at the supermarket.'],['sell','vendre','verbs','The company ___ services.'],['know','savoir / connaître','verbs','I ___ the answer.'],['think','penser','verbs','I ___ this idea is good.'],['need','avoir besoin de','verbs','We ___ more time.'],['want','vouloir','verbs','I ___ to improve my English.'],['work','travailler','work','I ___ in a small company.'],['customer','client','work','The ___ called the company.'],['supplier','fournisseur','work','Our ___ delivers the products.'],['invoice','facture','work','Please send the ___ by email.'],['meeting','réunion','work','We have a ___ at 10 a.m.'],['employee','salarié','work','The company has 50 ___.'],['manager','responsable / manager','work','My ___ organizes the team.'],['company','entreprise','work','This ___ was created in 2010.'],['turnover','chiffre d’affaires','work','The company’s ___ increased.'],['order','commande','work','The customer placed an ___.'],['deadline','date limite','work','The ___ is Friday.'],['skills','compétences','work','Communication ___ are important.'],['home','maison / chez soi','daily','I am going ___.'],['food','nourriture','daily','We need to buy ___.'],['clothes','vêtements','daily','Her ___ are in the wardrobe.'],['money','argent','daily','I do not have enough ___.'],['friend','ami(e)','daily','She is my best ___.'],['family','famille','daily','My ___ lives in France.'],['morning','matin','daily','I work every ___.'],['evening','soir','daily','I watch TV in the ___.'],['happy','heureux / heureuse','adjectives','She is very ___.'],['tired','fatigué(e)','adjectives','I am ___ after work.'],['easy','facile','adjectives','This exercise is ___.'],['difficult','difficile','adjectives','English is not always ___.'],['important','important','adjectives','This document is very ___.'],['busy','occupé(e)','adjectives','I am ___ today.']];
let pool=W,score=+(localStorage.ebScore||0),streak=0,current,lastType='',stats=JSON.parse(localStorage.ebStats||'{}');
function norm(s){return s.toLowerCase().trim().replace(/[’']/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function start(cat){pool=cat==='mix'?W:W.filter(x=>x[2]===cat); next()}
function next(){current=pool[Math.floor(Math.random()*pool.length)]; let types=['fr-en','en-fr','mcq','gap','tf']; let choices=types.filter(x=>x!==lastType); let t=choices[Math.floor(Math.random()*choices.length)];lastType=t;render(t)}
function render(t){let [en,fr,cat,sent]=current,g=document.getElementById('game'); if(t==='fr-en')g.innerHTML=`<p class=small>Écris le mot anglais</p><div class=word>${fr}</div><input id=a autocomplete=off placeholder='Ta réponse…'><button class='primary' onclick="checkInput('${en.replace(/'/g,"\\'")}')">Vérifier</button><div id=fb></div>`;
if(t==='en-fr')g.innerHTML=`<p class=small>Que signifie ce mot ?</p><div class=word>${en}</div><input id=a autocomplete=off placeholder='Ta réponse en français…'><button class=primary onclick="checkInput('${fr.split(' / ')[0].replace(/'/g,"\\'")}')">Vérifier</button><div id=fb></div>`;
if(t==='gap')g.innerHTML=`<p class=small>Complète la phrase</p><h2>${sent}</h2><input id=a autocomplete=off placeholder='Mot manquant…'><button class=primary onclick="checkInput('${en.replace(/'/g,"\\'")}')">Vérifier</button><div id=fb></div>`;
if(t==='mcq'){let opts=[current,...W.filter(x=>x!==current).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);g.innerHTML=`<p class=small>Choisis la bonne traduction de <b>${en}</b></p>`+opts.map(o=>`<button class=choice onclick="pick(this,${o===current})">${o[1]}</button>`).join('')+`<div id=fb></div>`}
if(t==='tf'){let fake=Math.random()<.5, other=W.filter(x=>x!==current)[Math.floor(Math.random()*(W.length-1))][1], shown=fake?other:fr;g.innerHTML=`<p class=small>Vrai ou faux ?</p><h2>“${en}” = “${shown}”</h2><button class=choice onclick="pick(this,${!fake})">✅ Vrai</button><button class=choice onclick="pick(this,${fake})">❌ Faux</button><div id=fb></div>`} let inp=document.getElementById('a');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')g.querySelector('.primary').click()}}
function mark(ok){let k=current[0];stats[k]=stats[k]||{ok:0,bad:0};stats[k][ok?'ok':'bad']++;localStorage.ebStats=JSON.stringify(stats);if(ok){score+=10;streak++}else streak=0;localStorage.ebScore=score;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;updateStats()}
function checkInput(ans){let v=norm(document.getElementById('a').value), acceptable=ans.split(' / ').map(norm),ok=acceptable.some(a=>v===a);mark(ok);feedback(ok,ans)}
function pick(btn,ok){mark(ok);btn.classList.add(ok?'good':'bad');feedback(ok,current[0]+' = '+current[1])}
function feedback(ok,ans){document.getElementById('fb').innerHTML=`<p><b>${ok?'✅ Bravo !':'❌ Pas encore.'}</b> ${ok?'':'Réponse : <b>'+ans+'</b>'}</p><button class=next onclick=next()>Question suivante →</button>`}
function updateStats(){let vals=Object.values(stats),rev=vals.filter(x=>x.bad>x.ok).length,mas=vals.filter(x=>x.ok>=3&&x.ok>x.bad).length;document.getElementById('review').textContent=rev;document.getElementById('mastered').textContent=mas}document.getElementById('score').textContent=score;updateStats();start('mix');
</script></body></html>
